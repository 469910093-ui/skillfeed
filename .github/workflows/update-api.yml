# 把 main 上的 FastAPI 同步到阿里云 /opt/skill-feed 并重启。
# 静态页仍由 pages.yml 的 Nginx 作业覆盖；这里只动 API 代码与 venv。
# 不改 /opt/skill-feed/.env。手动触发，不跟 6 小时内容刷新绑在一起。
name: Update API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-api:
    name: Aliyun · skillfeed-api
    if: ${{ vars.ALIYUN_DEPLOY == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: git pull and restart skillfeed-api
        env:
          ALIYUN_SSH_KEY: ${{ secrets.ALIYUN_SSH_KEY }}
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_USER: ${{ secrets.ALIYUN_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$ALIYUN_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 15 -H "$ALIYUN_HOST" >> ~/.ssh/known_hosts
          ssh -o ConnectTimeout=15 "$ALIYUN_USER@$ALIYUN_HOST" 'bash -s' <<'EOF'
          set -euo pipefail
          cd /opt/skill-feed
          git fetch --prune origin
          before=$(git rev-parse --short HEAD)
          stamp=$(date +%Y%m%d%H%M%S)
          bak=/tmp/skillfeed-pre-pull-$stamp
          mkdir -p "$bak"
          git status --short > "$bak/status.txt"
          for f in feed_dashboard.py requirements-server.txt server/app.py server/config.py server/db.py server/pay.py server/wechat_pay.py server/pack_delivery.py; do
            if [ -f "$f" ]; then
              mkdir -p "$bak/$(dirname "$f")"
              cp -a "$f" "$bak/$f"
            fi
          done
          git checkout -- feed_dashboard.py requirements-server.txt server/app.py server/config.py server/db.py server/pay.py
          # 只删未跟踪的旧副本（会挡住 pull 新增同名文件）。已跟踪的文件删了，
          # pull 只应用两次提交之间的差异，不会把它们补回来，API 起不来。
          for f in server/wechat_pay.py server/pack_delivery.py; do
            git ls-files --error-unmatch "$f" >/dev/null 2>&1 || rm -f "$f"
          done
          git pull --ff-only origin main
          git checkout HEAD -- server/wechat_pay.py server/pack_delivery.py
          .venv/bin/pip install -q -r requirements-server.txt \
            -i https://mirrors.aliyun.com/pypi/simple/ \
            --trusted-host mirrors.aliyun.com
          sudo systemctl restart skillfeed-api
          healthy=0
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8787/health; then healthy=1; break; fi
            sleep 2
          done
          if [ "$healthy" != 1 ]; then
            sudo journalctl -u skillfeed-api -n 60 --no-pager || true
            exit 1
          fi
          echo
          echo "api_rev ${before} -> $(git rev-parse --short HEAD)"
          echo "backup $bak"
          systemctl is-active skillfeed-api
          EOF
