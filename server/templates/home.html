<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>skill-feed API</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1a1a1a; --muted:#6b7280; --line:#e5e7eb; --accent:#db2777; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: Outfit, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--ink); min-height: 100vh;
    background: linear-gradient(160deg, #fff7ed 0%, #fdf2f8 45%, #eff6ff 100%);
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 48px 20px 80px; }
  h1 { font-size: 2rem; margin: 0 0 8px; letter-spacing: -.03em; }
  h1 span { color: var(--accent); }
  .lead { color: var(--muted); line-height: 1.5; margin: 0 0 28px; }
  .cards { display: grid; gap: 12px; }
  a.card {
    display: block; text-decoration: none; color: inherit;
    background: #fff; border: 1px solid var(--line); border-radius: 14px;
    padding: 16px 18px; transition: transform .15s, box-shadow .15s;
  }
  a.card:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(0,0,0,.06); }
  a.card strong { display: block; font-size: 1.05rem; margin-bottom: 4px; }
  a.card span { color: var(--muted); font-size: .88rem; line-height: 1.4; }
  .meta { margin-top: 28px; font-size: .8rem; color: var(--muted); }
  code { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>skill<span>feed</span> API</h1>
    <p class="lead">登录、发布自己的 skill、与官方发现流混排。仍然只推荐到 GitHub，不代装。</p>
    <div class="cards">
      <a class="card" href="/publish"><strong>发布 Skill（UGC）</strong><span>GitHub 登录后粘贴 SKILL.md 或仓库链接</span></a>
      <a class="card" href="/api/feed"><strong>GET /api/feed</strong><span>UGC + 官方 Pages 索引混排 JSON</span></a>
      <a class="card" href="/auth/me"><strong>GET /auth/me</strong><span>当前登录用户</span></a>
      <a class="card" href="/docs"><strong>OpenAPI 文档</strong><span>交互式接口说明</span></a>
      <a class="card" href="https://469910093-ui.github.io/skillfeed/" target="_blank" rel="noopener"><strong>静态发现站</strong><span>GitHub Pages 定时刷新的信息流</span></a>
    </div>
    <p class="meta">本地启动：<code>python skillfeed.py api</code> · 健康检查 <code>/health</code></p>
  </div>
</body>
</html>
