<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>发布 Skill · skill-feed</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1a1a1a; --muted:#6b7280; --line:#e5e7eb; --accent:#db2777; --bg:#fafafa; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Outfit, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--ink); }
  .bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; background: #fff; border-bottom: 1px solid var(--line);
    position: sticky; top: 0;
  }
  .logo { font-weight: 700; text-decoration: none; color: inherit; }
  .logo span { color: var(--accent); }
  .user { font-size: .85rem; color: var(--muted); display: flex; gap: 10px; align-items: center; }
  .btn {
    appearance: none; border: 0; border-radius: 10px; padding: 8px 12px;
    background: var(--ink); color: #fff; font: inherit; font-weight: 600; cursor: pointer;
    text-decoration: none; display: inline-block;
  }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.5rem; margin: 0 0 6px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: .9rem; line-height: 1.45; }
  label { display: block; font-size: .8rem; font-weight: 600; margin: 14px 0 6px; }
  input, textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
    font: inherit; background: #fff;
  }
  textarea { min-height: 220px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .82rem; line-height: 1.45; }
  .hint { font-size: .75rem; color: var(--muted); margin-top: 4px; }
  .ok { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; padding: 10px 12px; border-radius: 10px; margin-bottom: 14px; font-size: .88rem; }
  .list { margin-top: 28px; }
  .post {
    background: #fff; border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 10px;
  }
  .post b { display: block; margin-bottom: 4px; }
  .post small { color: var(--muted); }
  .gate { display: none; }
  .gate.show { display: block; }
  .need-login {
    background: #fff; border: 1px solid var(--line); border-radius: 14px;
    padding: 28px 20px; text-align: center;
  }
</style>
</head>
<body>
  <div class="bar">
    <a class="logo" href="/">skill<span>feed</span></a>
    <div class="user" id="userBox">检查登录…</div>
  </div>
  <div class="wrap">
    <h1>发布自己的 Skill</h1>
    <p class="sub">粘贴 <code>SKILL.md</code> 正文，或附上公开 GitHub 仓库链接。发布后进入混排 Feed（不代装到本机）。</p>

    <div id="okBanner" class="ok" style="display:none">已发布！可在下方「我的帖子」或 <a href="/api/feed?source=ugc">/api/feed?source=ugc</a> 查看。</div>

    <div id="needLogin" class="need-login gate">
      <p>发布需要 GitHub 登录</p>
      <p style="margin:16px 0"><a class="btn" href="/auth/github">使用 GitHub 登录</a></p>
      <p class="hint">未配置 OAuth 时，本地可设 <code>SKILLFEED_DEV_AUTH=1</code> 后访问 <a href="/auth/dev-login">/auth/dev-login</a></p>
    </div>

    <form id="form" class="gate" method="post" action="/api/posts/form">
      <label for="title">标题（可空，默认从 SKILL.md 解析）</label>
      <input id="title" name="title" placeholder="例如：stop-slop / brainstorming">

      <label for="github_url">GitHub 仓库链接（推荐）</label>
      <input id="github_url" name="github_url" placeholder="https://github.com/owner/repo">

      <label for="description">一句话简介（可空）</label>
      <input id="description" name="description" placeholder="这个 skill 解决什么问题">

      <label for="body_md">SKILL.md 正文</label>
      <textarea id="body_md" name="body_md" placeholder="---&#10;name: my-skill&#10;description: ...&#10;---&#10;&#10;# My Skill&#10;..."></textarea>
      <div class="hint">至少提供正文或仓库链接之一；描述需足够说明用途。</div>

      <p style="margin-top:18px"><button class="btn" type="submit">发布到 Feed</button></p>
    </form>

    <div class="list" id="mine"></div>
  </div>
<script>
const LOGGED = "{{logged_in}}" === "1";
const params = new URLSearchParams(location.search);
if (params.get("ok") === "1") document.getElementById("okBanner").style.display = "block";

async function refreshMe() {
  const r = await fetch("/auth/me", { credentials: "include" });
  const data = await r.json();
  const box = document.getElementById("userBox");
  const form = document.getElementById("form");
  const need = document.getElementById("needLogin");
  if (data.user) {
    box.innerHTML = `<span>@${data.user.login}</span>
      <button class="btn ghost" type="button" id="btnLogout">退出</button>`;
    document.getElementById("btnLogout").onclick = async () => {
      await fetch("/auth/logout", { method: "POST", credentials: "include" });
      location.reload();
    };
    form.classList.add("show");
    need.classList.remove("show");
    loadMine();
  } else {
    box.innerHTML = `<a class="btn" href="/auth/github">登录</a>`;
    form.classList.remove("show");
    need.classList.add("show");
  }
}

async function loadMine() {
  const r = await fetch("/api/posts/me", { credentials: "include" });
  if (!r.ok) return;
  const data = await r.json();
  const el = document.getElementById("mine");
  if (!data.posts.length) {
    el.innerHTML = "<p class='hint'>还没有发布过。</p>";
    return;
  }
  el.innerHTML = "<h2 style='font-size:1.1rem'>我的帖子</h2>" + data.posts.map(p => `
    <div class="post">
      <b>${escapeHtml(p.title)}</b>
      <small>${escapeHtml(p.scene_label || "")} · ${escapeHtml(p.status)} · ${escapeHtml(p.created_at || "").slice(0,19)}</small>
      <div class="hint">${escapeHtml(p.description || "").slice(0,160)}</div>
    </div>
  `).join("");
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

refreshMe();
</script>
</body>
</html>
