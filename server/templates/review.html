<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>审核队列 · SkillFeeder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --chassis: #0c1020;
    --bg: #f4f7ff;
    --ink: #0a1848;
    --muted: #717171;
    --line: #cfd6ea;
    --card: #ffffff;
    --accent: #0d7377;
    --brand-purple: #9860e7;
    --brand-cyan: #49aaeb;
    --brand-mint: #64e2d4;
    --brand-grad: linear-gradient(90deg, var(--brand-purple) 0%, var(--brand-cyan) 52%, var(--brand-mint) 100%);
    --like-ink: #991b1b;
    --font: "Outfit", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); }
  html { overflow-x: hidden; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  header {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
    background: rgba(244,247,255,.92);
    border-bottom: 1px solid var(--line);
  }
  .logo {
    font-weight: 800; font-size: 1.15rem; letter-spacing: -.03em;
    text-decoration: none; color: var(--ink);
  }
  .logo .feeder {
    color: var(--brand-purple);
    background-image: var(--brand-grad);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  h1 { font-size: .95rem; margin: 0; font-weight: 700; }
  .views { display: flex; flex-wrap: wrap; gap: 6px; }
  .views button, header a, .panel button {
    appearance: none; border: 1px solid var(--line); background: #fff; color: var(--ink);
    border-radius: 999px; padding: 6px 12px; font: inherit; font-size: .78rem; font-weight: 600;
    cursor: pointer; text-decoration: none;
  }
  .views button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  header a { color: var(--accent); }
  .wrap { display: grid; grid-template-columns: 1fr 300px; gap: 16px; padding: 16px; }
  @media (max-width: 860px) {
    .wrap { grid-template-columns: 1fr; padding: 12px; }
    .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { min-width: 640px; }
  }
  @media (min-width: 1100px) {
    .wrap { grid-template-columns: minmax(0, 1fr) 340px; padding: 20px 24px; }
  }
  table { width: 100%; border-collapse: collapse; background: var(--card); font-size: 13px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  th, td { border-bottom: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
  th { background: #eef3ff; font-size: .72rem; color: var(--muted); letter-spacing: .03em; }
  tr { cursor: pointer; }
  tr.on td { background: #eef3ff; }
  .panel {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px;
  }
  .panel p { margin: 0 0 10px; font-size: .85rem; line-height: 1.45; }
  textarea {
    width: 100%; min-height: 72px; border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 10px; font: inherit; background: #fff; color: var(--ink);
  }
  .err { color: var(--like-ink); font-weight: 600; }
  .ok { color: var(--accent); font-weight: 600; }
  a { color: var(--accent); }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  code { font-size: .85em; }
</style>
</head>
<body>
  <header>
    <a class="logo" href="/">Skill<span class="feeder">Feeder</span></a>
    <h1>审核队列</h1>
    <div class="views">
      <button type="button" data-status="pending" class="on">待审核</button>
      <button type="button" data-status="rejected">已拒绝</button>
      <button type="button" data-status="approved">已上架</button>
      <button type="button" data-status="hidden">已隐藏</button>
    </div>
    <a id="csv" href="/api/op/queue.csv">导出 CSV（飞书）</a>
    <a href="/publish">投稿页</a>
  </header>
  <div class="wrap">
    <div class="table-scroll">
    <table>
      <thead>
        <tr><th>标题</th><th>文案</th><th>GitHub</th><th>path</th><th>作者</th><th>提交</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    </div>
    <aside class="panel" id="panel">先选一行。打开 GitHub 看仓库，不要在站内渲染正文。</aside>
  </div>
<script nonce="{{csp_nonce}}">
let status = "pending";
let rows = [];
let selected = 0;

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

async function load() {
  const r = await fetch("/api/op/queue?status=" + encodeURIComponent(status), { credentials: "include" });
  if (r.status === 403) { document.body.innerHTML = "<p style='padding:24px'>需要运营账号（SKILLFEED_OPERATOR_LOGINS）</p>"; return; }
  const data = await r.json();
  rows = data.posts || [];
  selected = 0;
  document.getElementById("rows").innerHTML = rows.map((p, i) => `
    <tr data-i="${i}" class="${i === selected ? "on" : ""}">
      <td>${esc(p.title)}</td>
      <td>${esc((p.description || "").slice(0, 80))}</td>
      <td><a href="${esc(p.github_url)}" target="_blank" rel="noopener">${esc(p.full_name)}</a></td>
      <td><code>${esc(p.skill_path)}</code></td>
      <td>${esc(p.author_login)} / ${esc(p.trust_level)} · ${esc(p.approved_count)}</td>
      <td>${esc((p.created_at || "").slice(0, 16))}</td>
    </tr>`).join("") || "<tr><td colspan='6'>没有记录</td></tr>";
  document.querySelectorAll(".views button").forEach(b => {
    b.classList.toggle("on", b.dataset.status === status);
  });
  const csv = document.getElementById("csv");
  if (csv) csv.href = "/api/op/queue.csv?status=" + encodeURIComponent(status);
  renderPanel();
}

function renderPanel() {
  const p = rows[selected];
  const el = document.getElementById("panel");
  if (!p) { el.textContent = "这个视图没有记录"; return; }
  el.innerHTML = `
    <p><b>${esc(p.title)}</b></p>
    <p>${esc(p.description)}</p>
    <p><a href="${esc(p.github_url)}" target="_blank" rel="noopener">打开 GitHub</a><br><code>${esc(p.skill_path)}</code></p>
    ${p.reject_reason ? `<p class="err">上次拒绝：${esc(p.reject_reason)}</p>` : ""}
    <label>拒绝原因</label>
    <textarea id="note" placeholder="拒绝时必填"></textarea>
    <div class="actions">
      <button type="button" data-act="approve">通过</button>
      <button type="button" data-act="reject">拒绝</button>
      <button type="button" data-act="feature">精选</button>
      <button type="button" data-act="hide">隐藏</button>
      <button type="button" data-act="ban">封禁作者</button>
    </div>
    <p class="ok" id="log"></p>`;
}

document.getElementById("rows").addEventListener("click", e => {
  const tr = e.target.closest("tr[data-i]");
  if (!tr) return;
  selected = Number(tr.dataset.i);
  document.querySelectorAll("#rows tr").forEach(x => x.classList.toggle("on", x === tr));
  renderPanel();
});

document.querySelector(".views").addEventListener("click", e => {
  const b = e.target.closest("button[data-status]");
  if (!b) return;
  status = b.dataset.status;
  load();
});

document.getElementById("panel").addEventListener("click", async e => {
  const b = e.target.closest("button[data-act]");
  if (!b || !rows[selected]) return;
  const note = (document.getElementById("note") || {}).value || "";
  const r = await fetch("/api/op/posts/" + rows[selected].id, {
    method: "POST",
    credentials: "include",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action: b.dataset.act, note, ban_author: b.dataset.act === "ban" }),
  });
  const data = await r.json().catch(() => ({}));
  const log = document.getElementById("log");
  if (!r.ok) { if (log) log.className = "err"; if (log) log.textContent = data.detail || "失败"; return; }
  load();
});

load();
</script>
</body>
</html>
