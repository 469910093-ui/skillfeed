# 并进 skillfeeder.cn 现有 server {}，不要整份覆盖。
# 静态首页继续由 deploy_to_aliyun.ps1 / Actions 覆盖 /var/www/html/index.html。
# FastAPI 只接登录、鉴权和 API。
#
# 生产实际 include：/etc/nginx/snippets/skillfeeder-api.conf
# 中文 Windows 浏览器对「无 charset 的 text/plain」会按 GBK 打开，
# 必须标 utf-8，否则 /llms.txt 看起来像乱码。

charset utf-8;
charset_types text/html text/plain text/markdown text/xml application/json application/xml application/javascript;

location = /health {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location ^~ /login {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location ^~ /auth/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location ^~ /api/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location ^~ /publish {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# /op 必须单独写：只写 /op/ 时，浏览器打开 /op 会先 301 再和 FastAPI 的
# 去斜杠 307 互相踢，已登录运营会看到「打不开」。
location = /op {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location ^~ /op/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location = /admin {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location ^~ /admin/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location ^~ /p/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location ^~ /static/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Agent Surface：静态文件由 /var/www/html 直接吐，不进登录中间件。
# 打分 / 运营面仍只走上面的 /api /op 反代。
location = /llms.txt {
    default_type text/markdown;
    charset utf-8;
}
location = /llms-full.txt {
    default_type text/markdown;
    charset utf-8;
}
location = /robots.txt {
    default_type text/plain;
    charset utf-8;
}
location = /sitemap.xml {
    default_type application/xml;
    charset utf-8;
}
location = /about.md {
    default_type text/markdown;
    charset utf-8;
}
location = /faq.md {
    default_type text/markdown;
    charset utf-8;
}
location = /compare.md {
    default_type text/markdown;
    charset utf-8;
}
location = /catalog.json {
    default_type application/json;
    charset utf-8;
}
